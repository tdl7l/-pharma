<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هيربال فارما | Herbal Pharma</title>
  
  <!-- استدعاء خط Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- استدعاء مكتبات React و Tailwind من الإنترنت مباشرة -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.production.min.js"></script>

  <!-- إعدادات Tailwind المخصصة -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { light: '#4ade80', DEFAULT: '#16a34a', dark: '#15803d' },
          },
          fontFamily: { cairo: ['Cairo', 'sans-serif'] },
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #ffffff; color: #1f2937; }
    .font-cairo { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;
    const { HashRouter, Routes, Route, Link, useLocation } = ReactRouterDOM;

    // ================= البيانات =================
    const companyData = {
      name: "هيربال فارما",
      address: "953G+33P، شارع الستين، صنعاء، اليمن",
      phones: ["0770 696 202", "0233373831"],
      email: "anemonproducts@gmail.com",
      workingHours: "سيتم الإعلان قريباً",
      mapUrl: "https://maps.google.com/maps?q=15.3527237,44.1752148&z=15&output=embed",
      vision: "أن نكون الرائدين في تقديم الحلول الدوائية والعلاجية الطبيعية في اليمن والمنطقة.",
      mission: "توفير منتجات طبية وتجميلية عالية الجودة تعتمد على المعايير العلمية لتعزيز صحة المجتمع.",
      values: ["الجودة", "الأمان", "الابتكار", "المسؤولية الاجتماعية"],
    };

    // ================= المكونات المشتركة =================
    const Section = ({ children, className = "", id }) => (
      <section id={id} className={`py-16 px-6 md:px-12 lg:px-24 ${className}`}>
        {children}
      </section>
    );

    const Navbar = () => {
      const [isOpen, setIsOpen] = useState(false);
      const navLinks = [
        { name: 'الرئيسية', path: '/' },
        { name: 'من نحن', path: '/about' },
        { name: 'المنتجات', path: '/products' },
        { name: 'اتصل بنا', path: '/contact' },
      ];
      return (
        <nav className="fixed top-0 w-full bg-white shadow-md z-50 font-cairo">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between h-16 items-center">
              <div className="flex-shrink-0 flex items-center">
                <Link to="/" className="text-primary text-2xl font-bold tracking-tighter">هيربال فارما</Link>
              </div>
              <div className="hidden md:block">
                <div className="ml-10 flex items-baseline space-x-reverse space-x-8">
                  {navLinks.map(link => (
                    <Link key={link.path} to={link.path} className="text-gray-600 hover:text-primary px-3 py-2 font-medium transition-colors">{link.name}</Link>
                  ))}
                </div>
              </div>
              <div className="md:hidden">
                <button onClick={() => setIsOpen(!isOpen)} className="text-gray-600 p-2">
                  <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {isOpen ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /> : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16m-7 6h7" />}
                  </svg>
                </button>
              </div>
            </div>
          </div>
          {isOpen && (
            <div className="md:hidden bg-white border-t">
              <div className="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                {navLinks.map(link => (
                  <Link key={link.path} to={link.path} onClick={() => setIsOpen(false)} className="block text-gray-600 hover:bg-green-50 hover:text-primary px-3 py-2 rounded-md text-base font-medium">{link.name}</Link>
                ))}
              </div>
            </div>
          )}
        </nav>
      );
    };

    const Footer = () => (
      <footer className="bg-gray-900 text-white py-12 px-6 md:px-12 lg:px-24 font-cairo">
        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
          <div>
            <h3 className="text-xl font-bold mb-4 text-primary-light">{companyData.name}</h3>
            <p className="text-gray-400 leading-relaxed">رواد في تقديم الحلول الدوائية الطبيعية والعلمية في اليمن، نلتزم بالجودة والتميز في كل منتج نقدمه.</p>
          </div>
          <div>
            <h3 className="text-xl font-bold mb-4 text-primary-light">روابط سريعة</h3>
            <ul className="space-y-2 text-gray-400">
              <li><Link to="/" className="hover:text-white transition-colors">الرئيسية</Link></li>
              <li><Link to="/about" className="hover:text-white transition-colors">من نحن</Link></li>
              <li><Link to="/products" className="hover:text-white transition-colors">المنتجات</Link></li>
              <li><Link to="/contact" className="hover:text-white transition-colors">اتصل بنا</Link></li>
            </ul>
          </div>
          <div>
            <h3 className="text-xl font-bold mb-4 text-primary-light">معلومات التواصل</h3>
            <ul className="space-y-2 text-gray-400">
              <li>{companyData.address}</li>
              <li>{companyData.phones.join(' / ')}</li>
              <li>{companyData.email}</li>
            </ul>
          </div>
        </div>
        <div className="border-t border-gray-800 mt-10 pt-6 text-center text-gray-500 text-sm">
          © {new Date().getFullYear()} {companyData.name}. جميع الحقوق محفوظة.
        </div>
      </footer>
    );

    // ================= الصفحات =================
    const Home = () => {
      const categories = [
        { title: 'أدوية بشرية', desc: 'علاجات متطورة لضمان صحة أفضل', icon: '💊' },
        { title: 'مستحضرات طبية', desc: 'منتجات طبية متخصصة وعالية الجودة', icon: '🧪' },
        { title: 'مستحضرات تجميل', desc: 'عناية طبيعية تبرز جمالك', icon: '✨' },
      ];
      return (
        <>
          <Section className="pt-32 bg-gradient-to-b from-green-50 to-white text-center">
            <h1 className="text-4xl md:text-6xl font-bold text-gray-900 mb-6">طبيعة نقية.. <span className="text-primary">صحة مستدامة</span></h1>
            <p className="text-lg text-gray-600 mb-10 max-w-2xl mx-auto">نحن في هيربال فارما نجمع بين العلم والطبيعة لنقدم لكم أجود المنتجات الدوائية والتجميلية في قلب صنعاء.</p>
            <div className="flex justify-center gap-4">
              <Link to="/products" className="bg-primary text-white px-8 py-3 rounded-full font-semibold hover:bg-primary-dark transition-all">تصفح المنتجات</Link>
              <Link to="/contact" className="border-2 border-primary text-primary px-8 py-3 rounded-full font-semibold hover:bg-primary hover:text-white transition-all">اتصل بنا</Link>
            </div>
          </Section>

          <Section className="bg-white">
            <h2 className="text-3xl font-bold text-center mb-12">لماذا تختار هيربال فارما؟</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
              {[
                { title: 'جودة عالمية', text: 'نتبع أعلى المعايير الدولية في تصنيع واختيار موادنا.' },
                { title: 'مكونات طبيعية', text: 'نركز على استخلاص فوائد الطبيعة بأحدث التقنيات.' },
                { title: 'خبرة محلية', text: 'نفهم احتياجات السوق اليمني ونقدم حلولاً مخصصة.' },
              ].map((feat, i) => (
                <div key={i} className="p-8 rounded-2xl border border-gray-100 hover:shadow-xl transition-shadow bg-gray-50">
                  <div className="w-12 h-12 bg-primary text-white rounded-full flex items-center justify-center mx-auto mb-4 text-xl font-bold">{i + 1}</div>
                  <h3 className="text-xl font-bold mb-3">{feat.title}</h3>
                  <p className="text-gray-600">{feat.text}</p>
                </div>
              ))}
            </div>
          </Section>

          <Section className="bg-green-50">
            <h2 className="text-3xl font-bold text-center mb-12">أقسامنا الرئيسية</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {categories.map((cat, i) => (
                <div key={i} className="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md transition-all text-center border-b-4 border-primary">
                  <div className="text-4xl mb-4">{cat.icon}</div>
                  <h3 className="text-xl font-bold mb-2">{cat.title}</h3>
                  <p className="text-gray-600 mb-4">{cat.desc}</p>
                  <Link to="/products" className="text-primary font-semibold hover:underline">عرض المزيد ←</Link>
                </div>
              ))}
            </div>
          </Section>
        </>
      );
    };

    const About = () => (
      <div className="pt-20">
        <Section className="bg-primary text-white text-center">
          <h1 className="text-4xl font-bold mb-4">من نحن</h1>
          <p className="text-xl opacity-90">شريككم الموثوق في الرعاية الصحية الطبيعية</p>
        </Section>
        <Section className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
          <div>
            <h2 className="text-3xl font-bold mb-6 text-primary">رؤيتنا</h2>
            <p className="text-lg text-gray-600 leading-relaxed">{companyData.vision}</p>
          </div>
          <div className="bg-green-50 p-8 rounded-3xl">
            <h2 className="text-3xl font-bold mb-6 text-primary">رسالتنا</h2>
            <p className="text-lg text-gray-600 leading-relaxed">{companyData.mission}</p>
          </div>
        </Section>
        <Section className="bg-gray-50">
          <h2 className="text-3xl font-bold text-center mb-12 text-primary">قيمنا الجوهرية</h2>
          <div className="flex flex-wrap justify-center gap-4">
            {companyData.values.map((val, i) => (
              <span key={i} className="bg-white px-6 py-3 rounded-full shadow-sm border border-green-100 text-primary font-bold text-lg">{val}</span>
            ))}
          </div>
        </Section>
      </div>
    );

    const Products = () => {
      const sections = [
        { title: "أدوية بشرية", items: ["مكملات غذائية", "أدوية عشبية", "مقويات عامة", "علاجات طبيعية"], color: "bg-green-100" },
        { title: "مستحضرات طبية", items: ["معقمات", "كريمات علاجية", "زيوت طبية", "مراهم طبيعية"], color: "bg-blue-100" },
        { title: "مستحضرات تجميل", items: ["كريمات تفتيح", "زيوت للشعر", "منتجات العناية بالبشرة", "صابون طبيعي"], color: "bg-pink-100" }
      ];
      return (
        <div className="pt-20">
          <Section className="bg-primary text-white text-center">
            <h1 className="text-4xl font-bold mb-4">منتجاتنا</h1>
            <p className="text-xl opacity-90">جودة تلامس حياتكم وصحتكم</p>
          </Section>
          <Section className="grid grid-cols-1 md:grid-cols-3 gap-8">
            {sections.map((sec, i) => (
              <div key={i} className={`p-8 rounded-3xl ${sec.color} border border-gray-200`}>
                <h2 className="text-2xl font-bold mb-6 text-gray-800 border-b-2 border-gray-300 pb-2">{sec.title}</h2>
                <ul className="space-y-4">
                  {sec.items.map((item, idx) => (
                    <li key={idx} className="flex items-center gap-3 text-gray-700 font-medium"><span className="text-primary">✓</span> {item}</li>
                  ))}
                </ul>
              </div>
            ))}
          </Section>
        </div>
      );
    };

    const Contact = () => (
      <div className="pt-20">
        <Section className="bg-primary text-white text-center">
          <h1 className="text-4xl font-bold mb-4">اتصل بنا</h1>
          <p className="text-xl opacity-90">نسعد بتواصلكم واستفساراتكم</p>
        </Section>
        <Section className="grid grid-cols-1 md:grid-cols-2 gap-12">
          <div>
            <h2 className="text-2xl font-bold mb-6 text-primary">معلومات التواصل</h2>
            <ul className="space-y-5 text-gray-700">
              <li className="flex items-start gap-3">
                <span className="text-primary text-xl">📍</span>
                <div><p className="font-semibold">العنوان</p><p className="text-gray-600">{companyData.address}</p></div>
              </li>
              <li className="flex items-start gap-3">
                <span className="text-primary text-xl">📞</span>
                <div><p className="font-semibold">الهاتف</p><p className="text-gray-600">{companyData.phones.join(' / ')}</p></div>
              </li>
              <li className="flex items-start gap-3">
                <span className="text-primary text-xl">✉️</span>
                <div><p className="font-semibold">البريد الإلكتروني</p><p className="text-gray-600">{companyData.email}</p></div>
              </li>
              <li className="flex items-start gap-3">
                <span className="text-primary text-xl">🕒</span>
                <div><p className="font-semibold">ساعات العمل</p><p className="text-gray-600">{companyData.workingHours}</p></div>
              </li>
            </ul>
          </div>
          <div>
            <h2 className="text-2xl font-bold mb-6 text-primary">موقعنا على الخريطة</h2>
            <div className="rounded-2xl overflow-hidden shadow-lg border border-gray-200">
              <iframe src={companyData.mapUrl} width="100%" height="350" style={{ border: 0 }} allowFullScreen loading="lazy" referrerPolicy="no-referrer-when-downgrade" title="موقع هيربال فارما" />
            </div>
          </div>
        </Section>
      </div>
    );

    // ================= التطبيق الرئيسي =================
    const ScrollToTop = () => {
      const { pathname } = useLocation();
      useEffect(() => { window.scrollTo(0, 0); }, [pathname]);
      return null;
    };

    function App() {
      return (
        <HashRouter>
          <ScrollToTop />
          <div className="min-h-screen flex flex-col font-cairo">
            <Navbar />
            <main className="flex-grow">
              <Routes>
                <Route path="/" element={<Home />} />
                <Route path="/about" element={<About />} />
                <Route path="/products" element={<Products />} />
                <Route path="/contact" element={<Contact />} />
              </Routes>
            </main>
            <Footer />
          </div>
        </HashRouter>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
